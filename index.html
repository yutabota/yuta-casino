<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YUTA CASINO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0f172a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; text-align: center; }
        .header { font-size: 24px; font-weight: bold; color: #f59e0b; margin-bottom: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .btn { background: #f59e0b; color: #000; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 10px; margin: 10px; cursor: pointer; width: 100%; }
        .btn:active { background: #d97706; }
        .balance { font-size: 20px; color: #10b981; margin-bottom: 15px; font-weight: bold; }
        .slots { display: flex; justify-content: center; font-size: 50px; margin: 20px 0; letter-spacing: 10px; }
    </style>
</head>
<body>
    <div class="header">🎰 YUTA CASINO</div>
    <div class="balance">Balance: <span id="balance">0</span> Points</div>
    
    <div class="card">
        <h3>🎲 Dice Game</h3>
        <div class="slots" id="dice-result">🎲 🎲</div>
        <button class="btn" onclick="playGame('dice')">Roll Dice (Bet 1 Point)</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        // Get data from bot if available
        let userBalance = parseInt(tg.initDataUnsafe?.user?.id) ? 10 : 0; // Placeholder
        document.getElementById('balance').innerText = userBalance;

        function playGame(gameType) {
            if (userBalance < 1) {
                tg.showAlert("Insufficient points!");
                return;
            }
            
            // Send data to bot
            tg.sendData(JSON.stringify({
                action: "play",
                game: gameType,
                bet: 1
            }));
        }
    </script>
</body>
</html>
